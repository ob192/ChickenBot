services:
  bot:
    build: .
    image: ${IMAGE:-sasha192bunin/chickenbot}:${TAG:-latest}
    command: ["uv", "run", "--no-sync", "python", "-m", "telegram_bot.main"]
    env_file: ${ENV_FILE:-.env}
    restart: unless-stopped

  api:
    build: .
    image: ${IMAGE:-sasha192bunin/chickenbot}:${TAG:-latest}
    command:
      ["uv", "run", "--no-sync", "uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: ${ENV_FILE:-.env}
    ports:
      - "8000:8000"
    restart: unless-stopped

  admin:
    build: ./admin
    image: ${IMAGE:-sasha192bunin/chickenbot}-admin:${TAG:-latest}
    environment:
      # Inside the compose network the API is reachable by service name
      API_BASE_URL: http://api:8000
      API_KEY: ${API_KEY:?set API_KEY in .env}
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
